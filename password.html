<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Lab | CTF</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--bg:#0c1110;--panel:#151d19;--line:#2b3930;--ink:#eff5ee;--muted:#97ab9c;--lime:#bcf578}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#25443266,transparent 65%),var(--bg);color:var(--ink);font:15px/1.6 Arial,Helvetica,sans-serif}.layout{max-width:650px;margin:0 auto;padding:42px 24px}main{min-width:0}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px;gap:15px}.eyebrow{font:11px monospace;letter-spacing:2px;color:var(--lime)}.status{border:1px solid var(--line);padding:5px 10px;border-radius:20px;color:var(--muted);font:10px monospace;letter-spacing:.7px}.task-icon{width:54px;height:54px;display:grid;place-items:center;background:#1b3021;border:1px solid #3d5c3e;color:var(--lime);border-radius:15px;font:24px monospace;margin-bottom:18px}h1{font-size:40px;font-weight:600;letter-spacing:-1.5px;line-height:1.1;margin:0 0 14px}.intro{font-size:15px;color:var(--muted);margin:0 0 28px;max-width:520px}.card{padding:26px;border:1px solid var(--line);background:linear-gradient(145deg,#1a251e,#131b17);border-radius:18px;box-shadow:0 20px 70px #0003}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}.cardhead h2{font-size:15px;font-weight:500;margin:0}.mini{font:9px monospace;color:var(--muted);letter-spacing:.8px}label{display:block;font-size:12px;font-weight:600;margin:18px 0 8px}input,select{font:15px/1.5 Arial,sans-serif;width:100%;background:#0c1410;border:1px solid #3a4c40;color:var(--ink);border-radius:9px;padding:13px 14px;outline:none}input:focus,select:focus{border-color:var(--lime);box-shadow:0 0 0 3px #bcf57814}button{border:0;border-radius:9px;background:var(--lime);color:#152410;cursor:pointer;padding:14px 18px;font:600 13px Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:15px;transition:background .15s}button:hover{background:#d2ffa0}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #bcf578;outline-offset:4px}.primary{width:100%;margin-top:22px;justify-content:space-between}.field{position:relative}.field input{padding-right:72px}.toggle{position:absolute;right:6px;top:7px;background:transparent;color:var(--muted);padding:8px;font-size:10px}.toggle:hover{background:#2d3d30;color:white}.checks{display:grid;grid-template-columns:1fr;gap:7px;margin:16px 0}.check{color:var(--muted);font-size:12px}.check:before{content:'○';margin-right:9px}.check.pass{color:var(--lime)}.check.pass:before{content:'✓'}.meter{height:4px;background:#344237;border-radius:4px;margin-top:17px;overflow:hidden}.meter div{height:100%;background:var(--lime);width:0;transition:width .2s}.help{color:var(--muted);font-size:12px;margin:10px 0 0}.feedback{color:#ffc2a3;font-size:12px}.feedback:empty{display:none}.success{padding:23px;margin-top:20px;border:1px solid #4b7144;background:#172d1c;border-radius:14px}.success h2{font-size:22px;font-weight:500;letter-spacing:-.5px;margin:9px 0 14px}.flagrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.flagrow code{color:var(--lime);font:14px/1.6 monospace;overflow-wrap:anywhere;min-width:0}.copy{padding:8px 10px;background:#2e4727;color:var(--lime);font-size:10px;flex-shrink:0}details{padding-top:18px;margin-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}summary{cursor:pointer;color:#c3d4c5}footer{margin-top:25px;text-align:center;font-size:11px;color:#708575}.notice{font-size:11px;color:var(--muted);margin:18px 4px}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.evidence a{background:#17241c;border:1px solid var(--line);border-radius:11px;padding:14px 12px;text-decoration:none;color:var(--ink);font-size:12px}.evidence a:hover{border-color:#7daa62}.evidence small{display:block;color:var(--lime);font:9px monospace;letter-spacing:1px;margin-bottom:9px}a{color:var(--lime)}[hidden]{display:none!important}@media(max-width:480px){.layout{padding:25px 17px}.topline{margin-bottom:26px}h1{font-size:34px}.card{padding:21px}.mini{font-size:8px}.flagrow{align-items:flex-start;flex-direction:column}.evidence{gap:7px}.evidence a{padding:12px 9px;font-size:11px}}dialog.flag-popup{color:#adffca;background:#03140c;border:1px solid #41ff8f;border-radius:16px;padding:0;width:min(600px,calc(100% - 32px));max-height:85vh;overflow:auto;box-shadow:0 0 60px #14ff6633,inset 0 0 40px #10ff6610}dialog.flag-popup::backdrop{background:#020706d9;backdrop-filter:blur(7px)}.digital-wrap{padding:32px;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#53ff8806 3px,#53ff8806 4px);text-align:center}.digital-top{font:11px monospace;letter-spacing:3px;color:#59ff9b}.digital-mark{font:38px monospace;color:#4fff97;margin:20px 0 4px;text-shadow:0 0 20px #36ff91}.digital-title{font:700 25px monospace;letter-spacing:2px;margin:12px 0}.digital-desc{color:#8cc6a1;font:12px/1.6 monospace}.digital-flag{display:block;background:#001a0c;border:1px solid #247640;border-radius:8px;padding:22px 12px;margin:24px 0;color:#60ffa0;text-shadow:0 0 12px #30ff8177;font:clamp(12px,2.4vw,21px)/1.6 monospace;overflow-wrap:anywhere;user-select:all}.digital-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.digital-actions button{background:#38ec80;color:#052514;font:700 12px monospace}.digital-actions .dismiss{border:1px solid #337947;background:transparent;color:#9dfcbe}.reopen{margin-top:18px;background:#344426;color:#dcfa78;padding:10px 14px;font-size:12px}@media(prefers-reduced-motion:no-preference){dialog.flag-popup[open]{animation:popup-in .22s ease-out}@keyframes popup-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}}</style>

</head><body><div class="layout"><main><div class="topline"><span class="eyebrow">CTF CHALLENGE</span><span id="status" class="status">AWAITING SOLVE</span></div><div class="task-icon" aria-hidden="true">✳</div><h1>Password Lab</h1><section class="card"><div class="cardhead"><h2>Password studio</h2><span class="mini">PASSWORD CHECK</span></div><form id="form"><label for="pw">Password</label><div class="field"><input id="pw" type="password" autocomplete="off" required><button type="button" class="toggle" data-toggle="pw">SHOW</button></div><p id="result" class="feedback" role="status"></p><button class="primary">Submit <span>↗</span></button></form></section><section id="success" class="success" hidden aria-live="polite"><div class="eyebrow">✓ Challenge complete</div><h2>Flag</h2><div class="flagrow"><code id="flag"></code><button type="button" class="copy" data-copy="flag">Copy flag</button></div><button id="reopen-popup" type="button" class="reopen">Show flag popup ↗</button></section></main></div><dialog id="flag-popup" class="flag-popup" aria-labelledby="popup-title" aria-describedby="popup-desc"><div class="digital-wrap"><div class="digital-top">[ SYSTEM / SUCCESS ]</div><div class="digital-mark" aria-hidden="true">&lt;✓&gt;</div><h2 id="popup-title" class="digital-title">FLAG CAPTURED</h2><p id="popup-desc" class="digital-desc">Access granted.</p><code id="popup-flag" class="digital-flag"></code><div class="digital-actions"><button type="button" data-copy="popup-flag">COPY FLAG</button><button type="button" class="dismiss" id="close-popup">CONTINUE →</button></div><p id="copy-status" class="digital-desc" role="status"></p></div></dialog><script>const $=id=>document.getElementById(id);function complete(){ $('status').textContent='COMPLETED';$('success').hidden=false;$('success').scrollIntoView({behavior:'smooth',block:'nearest'});showFlagPopup();}document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const p=$(b.dataset.toggle);p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'SHOW':'HIDE'});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const t=$(b.dataset.copy).textContent;try{await navigator.clipboard.writeText(t);b.textContent='Copied'}catch(e){const range=document.createRange();range.selectNodeContents($(b.dataset.copy));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='Selected — copy'}});
function checks(){return [$('pw').value.length>=16,new Set($('pw').value).size>=4,!/password|qwerty|letmein|123456/i.test($('pw').value)&&$('pw').value.length>0]}function update(){$('success').hidden=true;$('status').textContent='AWAITING SOLVE';$('result').textContent='';}$('pw').oninput=update;$('form').onsubmit=async (event)=>{
      event.preventDefault();
      if (!checks().every(Boolean)) {
        $('result').textContent='Password rejected.';
        return;
      }
      const button = document.querySelector('button.primary');
      button.disabled = true;
      $('result').textContent = 'Unlocking reward…';
      try {
        const receipt = checks().map((passed, index) => passed ? index + 1 : 0).join('-');
        const flag = await unlockReward('password-lab/' + receipt);
        if (!checks().every(Boolean)) return;
        $('flag').textContent = flag;
        $('result').textContent = '';
        complete();
      } catch (error) {
        $('result').textContent = 'Unable to unlock. Open this file in a current desktop browser and try again.';
      } finally {
        button.disabled = false;
      }
    };
    function showFlagPopup(){ $('popup-flag').textContent=$('flag').textContent;const modal=$('flag-popup');if(!modal.open)modal.showModal();} $('close-popup').onclick=()=>$('flag-popup').close();$('reopen-popup').onclick=showFlagPopup;
    // Only a successful decryption yields a reward. Nothing is fetched online.
    function decodeBytes(value) {
      return Uint8Array.from(atob(value), (letter) => letter.charCodeAt(0));
    }

    async function unlockReward(passphrase) {
      if (!globalThis.crypto || !crypto.subtle) {
        throw new Error('CRYPTO_UNAVAILABLE');
      }
      const material = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: decodeBytes(reward.salt), iterations: 120000, hash: 'SHA-256' },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const bytes = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: decodeBytes(reward.iv) }, key, decodeBytes(reward.data)
      );
      return new TextDecoder().decode(bytes);
    }

    const reward = {"salt": "i08GhWp4VMCjdanlf8152Q==", "iv": "VlEWXlteX5MCHJVn", "data": "7ge7BGxG4Gb+Lvf+dI7P9y2FG3tJrVX9Kvn/9W4PvvlHbn5payPmylGuCD2XJQ=="};
</script></body></html>
